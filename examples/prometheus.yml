global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'jetweir-monitor'

scrape_configs:
  - job_name: 'jetweir'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'jetweir-consumer'
    static_configs:
      - targets: ['localhost:8081']
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
